<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>如果你能看到这个。。就点这个按钮</title>
  <style>
    /* 基础样式，干净、轻快，带一点俏皮感 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(145deg, #f7f9fc 0%, #eaeef4 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      padding: 1rem;
      margin: 0;
    }

    /* 主卡片容器 */
    .container {
      max-width: 700px;
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 48px;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.15), 
                  inset 0 1px 3px rgba(255, 255, 255, 0.9);
      padding: 3rem 2rem;
      text-align: center;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.6);
      min-height: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 标题区域——使用更生动的排版 */
    .title {
      font-size: clamp(1.8rem, 8vw, 3.2rem);
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.02em;
      color: #1a2639;
      margin-bottom: 1.8rem;
      text-shadow: 0 4px 10px rgba(0, 20, 30, 0.08);
      word-break: break-word;
    }

    /* 按钮——圆润、有动感，颜色明亮 */
    .click-btn {
      background: #2d63e2;
      background: linear-gradient(135deg, #2b5fd9 0%, #1d47b0 100%);
      border: none;
      padding: 1.2rem 3.2rem;
      border-radius: 60px;
      font-size: 1.8rem;
      font-weight: 700;
      color: white;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 16px 28px -8px rgba(25, 60, 150, 0.5), 
                  0 4px 12px rgba(0, 0, 0, 0.1),
                  inset 0 -2px 0 rgba(0, 0, 0, 0.1);
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s;
      transform: translateY(0);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-family: inherit;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .click-btn:hover {
      background: #2d63e2;
      background: linear-gradient(135deg, #3568ea 0%, #234fbb 100%);
      transform: translateY(-3px);
      box-shadow: 0 24px 36px -10px rgba(25, 60, 150, 0.6), 0 6px 14px rgba(0, 0, 0, 0.1);
    }

    .click-btn:active {
      transform: translateY(1px);
      box-shadow: 0 8px 18px -6px rgba(25, 60, 150, 0.6), inset 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    /* 点击后显示的内容区域，初始隐藏 */
    .response-area {
      display: none;
      width: 100%;
      animation: fadeInUp 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }

    /* 显示状态的切换由JS添加类名控制 */
    .response-area.show {
      display: block;
    }

    /* 回应的卡片文字样式 */
    .message-card {
      background: #ffffffd9;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 40px;
      padding: 2.2rem 2rem;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.2), inset 0 1px 4px #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .message-text {
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      font-weight: 600;
      color: #1a2639;
      line-height: 1.4;
      margin-bottom: 1rem;
      letter-spacing: -0.01em;
    }

    /* 加一点细微的装饰 */
    .message-sub {
      font-size: 1.2rem;
      color: #5a6a7e;
      font-weight: 400;
      margin-top: 0.8rem;
      opacity: 0.8;
    }

    /* 动画 */
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 隐藏状态，用于控制 */
    .hidden {
      display: none;
    }

    /* 让容器在移动端更友好 */
    @media (max-width: 480px) {
      .container {
        padding: 2rem 1.2rem;
        min-height: 380px;
        border-radius: 36px;
      }

      .click-btn {
        padding: 1rem 1.8rem;
        font-size: 1.5rem;
      }

      .message-card {
        padding: 1.8rem 1rem;
      }
    }

    /* 移除按钮默认聚焦轮廓，但保留可访问性 */
    .click-btn:focus-visible {
      outline: 3px solid #ffffffcc;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 初始状态：标题 + 按钮 -->
    <div id="initialState">
      <h1 class="title">如果你能看到这个。。<br>就点这个按钮</h1>
      <button class="click-btn" id="clickMeBtn">赶紧点我</button>
    </div>

    <!-- 点击后的回应界面（初始隐藏） -->
    <div class="response-area" id="responseArea">
      <div class="message-card">
        <div class="message-text">哦哦哦，没什么事，<br>你到底在期待什么？</div>
        <div class="message-sub">（嗯，真的没什么……）</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const btn = document.getElementById('clickMeBtn');
      const initialState = document.getElementById('initialState');
      const responseArea = document.getElementById('responseArea');

      // 点击按钮的处理
      function handleClick() {
        // 隐藏初始区域（标题 + 按钮）
        if (initialState) {
          initialState.style.display = 'none';
        }
        // 显示回应区域，并且添加 show 类（触发动画）
        if (responseArea) {
          responseArea.classList.add('show');
        }
        // 可选：让按钮不可再点（但已经被隐藏了，这里可以不用额外处理）
      }

      // 绑定点击事件
      if (btn) {
        btn.addEventListener('click', handleClick);
      }

      // 如果需要，可以在页面加载时确保回应区域是隐藏的（CSS已处理，但以防万一）
      // 但CSS已做 display: none, 加上 .show 才显示，所以不需要额外重置。
      // 不过如果页面被缓存等，确保状态正确
      if (responseArea) {
        // 确保如果没有 show 类，它不可见（CSS已经做好）
        // 如果因为某种原因显示了，我们强制重置一下
        if (!responseArea.classList.contains('show')) {
          // 默认css已经是display: none，无影响
        }
      }
    })();
  </script>
</body>
</html>
